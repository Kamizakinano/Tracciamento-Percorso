name: Build iOS (IPA per Sideloadly)

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Installa XcodeGen
        run: brew install xcodegen

      - name: Genera il progetto Xcode
        working-directory: ios
        run: xcodegen generate

      - name: Compila (senza firma: la firma la fa Sideloadly)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project Percorso.xcodeproj \
            -scheme Percorso \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Crea l'IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Percorso.app Payload/
          zip -qry Percorso.ipa Payload

      - name: Carica l'IPA
        uses: actions/upload-artifact@v4
        with:
          name: Percorso-ipa
          path: ios/Percorso.ipa
