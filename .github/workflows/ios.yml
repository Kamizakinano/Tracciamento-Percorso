name: Build iOS (IPA per Sideloadly)

on:
  push:
    branches-ignore:
      - ipa-build
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Versione
        run: |
          BASE=$(sed -n 's/^ *MARKETING_VERSION: *"\(.*\)"/\1/p' ios/project.yml | head -1)
          echo "VERSION=${BASE}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "Versione: ${BASE}.${GITHUB_RUN_NUMBER}"

      - name: Controllo raggiungibilità OpenStreetMap (diagnostica)
        continue-on-error: true
        run: |
          for host in overpass-api.de overpass.kumi.systems overpass.private.coffee; do
            code=$(curl -s -o /tmp/op.json -w '%{http_code}' -m 40 -A 'Percorso iOS (uso personale)' \
              --data-urlencode 'data=[out:json][timeout:25];way["highway"="residential"](45.46,9.18,45.47,9.19);out geom;' \
              "https://$host/api/interpreter" || echo "errore")
            echo "$host -> HTTP $code, $(wc -c < /tmp/op.json) byte"
          done
          # Stessa richiesta dell'app (auto, centro di Milano, area massima).
          Q='[out:json][timeout:40];way["highway"~"^(primary|secondary|tertiary|unclassified|residential|living_street|trunk|primary_link|secondary_link|tertiary_link)$"](45.455,9.181,45.473,9.199);out geom;'
          curl -s -o /tmp/op2.json -w 'Richiesta app: HTTP %{http_code}, %{size_download} byte, %{time_total} s\n' -m 60 \
            -A 'Percorso iOS (uso personale)' --data-urlencode "data=$Q" https://overpass-api.de/api/interpreter || true
          head -c 300 /tmp/op2.json; echo

      - name: Installa XcodeGen
        run: brew install xcodegen

      - name: Genera il progetto Xcode
        working-directory: ios
        run: xcodegen generate

      - name: Test
        working-directory: ios
        run: |
          set -o pipefail
          # Primo iPhone disponibile nel simulatore installato sul runner.
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devs = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for rt, ds in sorted(devs.items(), reverse=True)
                     if "iOS" in rt for d in ds if d["name"].startswith("iPhone")))')
          echo "Simulatore: $UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcodebuild test \
            -project Percorso.xcodeproj \
            -scheme Percorso \
            -destination "id=$UDID" \
            -derivedDataPath build-test \
            CODE_SIGNING_ALLOWED=NO

      - name: Screenshot dal simulatore
        working-directory: ios
        continue-on-error: true
        run: bash scripts/screenshots.sh "$UDID" build-test/Build/Products/Debug-iphonesimulator/Percorso.app screenshots

      - name: Compila senza firma (la firma la fa Sideloadly)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project Percorso.xcodeproj \
            -scheme Percorso \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Crea l'IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Percorso.app Payload/
          zip -qry "Percorso-v$VERSION.ipa" Payload

      - name: Carica l'IPA
        uses: actions/upload-artifact@v4
        with:
          name: Percorso-v${{ env.VERSION }}
          path: ios/Percorso-v${{ env.VERSION }}.ipa

      # Ultima IPA sul branch ipa-build (un solo commit, sovrascritto a ogni build):
      # il file si chiama Percorso-v<versione>.ipa (vedi BUILD.txt).
      - name: Pubblica l'IPA sul branch ipa-build
        env:
          TOKEN: ${{ github.token }}
        run: |
          OUT=$(mktemp -d)
          cp "ios/Percorso-v$VERSION.ipa" "$OUT/"
          if ls ios/screenshots/*.png >/dev/null 2>&1; then
            mkdir -p "$OUT/screenshots" && cp ios/screenshots/*.png "$OUT/screenshots/"
          fi
          cd "$OUT"
          printf 'Versione: %s\nFile: Percorso-v%s.ipa\nCommit: %s\nBranch: %s\nData: %s\n' "$VERSION" "$VERSION" "$GITHUB_SHA" "$GITHUB_REF_NAME" "$(date -u +%Y-%m-%dT%H:%MZ)" > BUILD.txt
          git init -q -b ipa-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "Percorso v$VERSION (${GITHUB_SHA::7})"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ipa-build
