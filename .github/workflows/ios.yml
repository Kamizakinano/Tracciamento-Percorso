name: Build iOS (IPA per Sideloadly)

on:
  push:
    branches-ignore:
      - ipa-build
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Installa XcodeGen
        run: brew install xcodegen

      - name: Genera il progetto Xcode
        working-directory: ios
        run: xcodegen generate

      - name: Test
        working-directory: ios
        run: |
          set -o pipefail
          # Primo iPhone disponibile nel simulatore installato sul runner.
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devs = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for rt, ds in sorted(devs.items(), reverse=True)
                     if "iOS" in rt for d in ds if d["name"].startswith("iPhone")))')
          echo "Simulatore: $UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcodebuild test \
            -project Percorso.xcodeproj \
            -scheme Percorso \
            -destination "id=$UDID" \
            -derivedDataPath build-test \
            CODE_SIGNING_ALLOWED=NO

      - name: Screenshot dal simulatore
        working-directory: ios
        continue-on-error: true
        run: bash scripts/screenshots.sh "$UDID" build-test/Build/Products/Debug-iphonesimulator/Percorso.app screenshots

      - name: Compila senza firma (la firma la fa Sideloadly)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project Percorso.xcodeproj \
            -scheme Percorso \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Crea l'IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Percorso.app Payload/
          zip -qry Percorso.ipa Payload

      - name: Carica l'IPA
        uses: actions/upload-artifact@v4
        with:
          name: Percorso-ipa
          path: ios/Percorso.ipa

      # Ultima IPA sul branch ipa-build (un solo commit, sovrascritto a ogni build):
      # https://github.com/<owner>/<repo>/raw/ipa-build/Percorso.ipa
      - name: Pubblica l'IPA sul branch ipa-build
        env:
          TOKEN: ${{ github.token }}
        run: |
          OUT=$(mktemp -d)
          cp ios/Percorso.ipa "$OUT/"
          if ls ios/screenshots/*.png >/dev/null 2>&1; then
            mkdir -p "$OUT/screenshots" && cp ios/screenshots/*.png "$OUT/screenshots/"
          fi
          cd "$OUT"
          printf 'Commit: %s\nBranch: %s\nData: %s\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" "$(date -u +%Y-%m-%dT%H:%MZ)" > BUILD.txt
          git init -q -b ipa-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "IPA da ${GITHUB_SHA::7} (${GITHUB_REF_NAME})"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ipa-build
