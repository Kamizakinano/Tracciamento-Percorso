# Progetto Xcode generato con XcodeGen (https://github.com/yonaskolb/XcodeGen):
#   cd ios && xcodegen
name: Percorso
options:
  bundleIdPrefix: com.kamizakinano
  deploymentTarget:
    iOS: "16.2"
settings:
  base:
    # Versione principale: la sale chi aggiunge funzioni. La build su GitHub
    # aggiunge il numero di compilazione (es. 1.2 -> 1.2.7).
    MARKETING_VERSION: "1.7"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Percorso:
    type: application
    platform: iOS
    sources:
      - Percorso
      - Shared
    dependencies:
      - target: PercorsoLiveActivity
    info:
      path: Percorso/Info.plist
      properties:
        CFBundleDisplayName: Percorso
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - location
          - audio
        NSSupportsLiveActivities: true
        NSLocationWhenInUseUsageDescription: Serve la posizione per registrare il percorso e avvisarti quando passi su strade già fatte.
        NSLocationAlwaysAndWhenInUseUsageDescription: Con "Sempre" l'app registra i tuoi spostamenti da sola, anche senza aprirla, e colora le strade che hai fatto.
        NSCameraUsageDescription: Puoi scattare una foto del parcheggio (piano, colonna, cartello) per ritrovare l'auto.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kamizakinano.percorso
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  PercorsoLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - LiveActivity
      - Shared
    info:
      path: LiveActivity/Info.plist
      properties:
        CFBundleDisplayName: Percorso
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kamizakinano.percorso.LiveActivity
        SKIP_INSTALL: YES
  PercorsoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PercorsoTests
    dependencies:
      - target: Percorso
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Percorso:
    build:
      targets:
        Percorso: all
        PercorsoTests: [test]
    test:
      config: Debug
      targets:
        - PercorsoTests
